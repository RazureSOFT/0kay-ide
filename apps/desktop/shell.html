<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>0KAY IDE</title>
<link rel="stylesheet" href="shell.css" />
</head>
<body>
<main class="card">
  <h1>0KAY IDE</h1>
  <p class="sub">基于 Cline 的编辑器，工作区由本地 0kay-agent 提供</p>

  <div class="row"><span class="dot" id="core-dot"></span><span class="name">0kay-core</span><span class="val" id="core-val">检查中...</span></div>
  <div class="row"><span class="dot" id="agent-dot"></span><span class="name">0kay-agent</span><span class="val" id="agent-val">-</span></div>
  <div class="row"><span class="dot" id="ws-dot"></span><span class="name">工作区</span><span class="val" id="ws-val">-</span></div>
  <div class="row"><span class="dot" id="ui-dot"></span><span class="name">编辑器界面</span><span class="val" id="ui-val">宿主桥接中</span></div>

  <div class="actions">
    <button class="primary" id="open-web" disabled>打开对话</button>
    <button id="recheck">重新检查</button>
  </div>

  <p class="note">编辑器界面（Cline webview）需要宿主应答它启动时的 proto 请求，这一层还在接。上方的对话入口走的是本地 agent，现在就能用。</p>
</main>
<script src="shell.js"></script>
</body>
</html>
